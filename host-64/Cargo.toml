[workspace]

[package]
name = "ckb-zkvm-host-64"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "prove-v6"
path = "src/bin/prove.rs"

[[bin]]
name = "verify-v6"
path = "src/bin/verify.rs"

[dependencies]
# Shared libraries
ckb-zkvm-lib = { path = "../lib" }
ckb-zkvm-host-common = { path = "../host-common" }

# SP1 SDK — Hypercube v6 (64-bit RISC-V)
sp1-sdk = { git = "https://github.com/succinctlabs/sp1", tag = "v6.0.0-beta.1", features = ["network"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Error handling
anyhow = "1"

[build-dependencies]
sp1-build = { git = "https://github.com/succinctlabs/sp1", tag = "v6.0.0-beta.1" }

# Patch ckb-vm to use local version (same as main workspace)
[patch.crates-io]
ckb-vm = { path = "../ckb/ckb-vm" }

[patch."https://github.com/nervosnetwork/ckb-vm.git"]
ckb-vm = { path = "../ckb/ckb-vm" }

[patch."https://github.com/nervosnetwork/ckb-vm-contrib.git"]
protobuf-ckb-syscalls = { path = "../ckb/ckb-vm-contrib/protobuf-ckb-syscalls" }
ckb-vm-fuzzing-utils = { path = "../ckb/ckb-vm-contrib/ckb-vm-fuzzing-utils" }
