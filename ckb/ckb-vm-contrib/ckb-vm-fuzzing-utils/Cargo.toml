[package]
name = "ckb-vm-fuzzing-utils"
description = "CKB VM fuzzing utils"
version = "1.0.0"
license = "MIT"
edition = "2024"
authors = ["Nervos Core Dev <dev@nervos.org>"]

[dependencies]
int-enum = "1.2.0"
ckb-vm = { version = "=0.24.14", features = ["pprof"] }
ckb-std = { version = "=1.0.1", default-features = false, features = ["stub-syscalls"] }
regex = { version = "1.11.1", default-features = false }

[features]
default = ["std"]
std = ["regex/std"]
